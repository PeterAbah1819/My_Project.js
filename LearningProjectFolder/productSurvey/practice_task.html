<!DOCTYPE html>
<html>
<head>
  <title>Luxury Brand Feedback</title>
</head>
<body>
  <h1>Welcome to Luxury Brand Products Feedback</h1>

  <label for="name">Name:</label><br>
  <input type="text" id="name"><br>

  <label for="age">Age:</label><br>
  <input type="number" id="age"><br>

  <label for="email">Email:</label><br>
  <input type="email" id="email"><br>

  <label for="productType">Product Type:</label><br>
  <select id="productType">
    <option value="perfume">Perfume</option>
    <option value="cream">Cream</option>
    <option value="oils">Oils</option>
  </select><br>

  <label for="feedbackText">Feedback:</label><br>
  <textarea id="feedbackText" rows="3" cols="30" placeholder="Your feedback"></textarea><br>

  <label for="userExperince">Share your experience with the product:</label><br>
  <textarea id="userExperince" rows="3" cols="30" placeholder="Your experience"></textarea><br><br>

  <button id="submitBtn">Submit Feedback</button>

  <hr>
  <div id="userInfo" style="display: none;">
    <h2>User Feedback Summary:</h2>
    <p>Name: <span id="userName"></span></p>
    <p>Age: <span id="userAge"></span></p>
    <p>Email: <span id="userEmail"></span></p>
    <p>Product: <span id="userProduct"></span></p>
    <p>Feedback: <span id="userFeedback"></span></p>
    <p>Experience: <span id="userExperienceDisplay"></span></p>
  </div>

  <script src="practice_task.js"></script>
</body>
</html>
